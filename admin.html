<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LunaBloom • Royal Cloud Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #c5a059;
            --gold-dark: #9a7d46;
            --black: #0a0a0a;
            --dark-grey: #161616;
            --text-light: #e0e0e0;
            --accent-red: #ff4d4d;
            --transition: 0.35s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--black);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--dark-grey);
            border-right: 1px solid rgba(197,160,89,0.12);
            padding: 40px 20px;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: transform var(--transition);
            transform: translateX(0);
        }

        .sidebar h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 50px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #aaa;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 10px;
            transition: var(--transition);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(197,160,89,0.1);
            color: var(--gold);
        }

        .main-content {
            margin-left: 280px;
            padding: 24px 28px;
            min-height: 100vh;
            transition: margin-left var(--transition);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 26px;
            cursor: pointer;
            padding: 12px;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 110;
        }

        /* Header fix */
        .header-section {
            margin-bottom: 32px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 600;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(197,160,89,0.18);
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(197,160,89,0.28);
        }

        .table-card {
            background: var(--dark-grey);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            overflow-x: auto;
        }

        table { 
            width: 100%; 
            min-width: 620px;
            border-collapse: collapse; 
        }

        th { 
            text-align: left; 
            padding: 14px 12px; 
            color: var(--gold); 
            font-size: 0.82rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            border-bottom: 1px solid #222; 
            white-space: nowrap;
        }

        td { 
            padding: 14px 12px; 
            border-bottom: 1px solid #1f1f1f; 
        }

        .product-img { 
            width: 48px; 
            height: 48px; 
            border-radius: 8px; 
            object-fit: cover; 
            border: 1px solid rgba(197,160,89,0.15); 
        }

        .action-btn {
            background: rgba(255,77,77,0.12);
            color: var(--accent-red);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: var(--accent-red);
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-box {
            background: #181818;
            width: min(92%, 540px);
            padding: 28px 22px;
            border-radius: 20px;
            border: 1px solid rgba(197,160,89,0.22);
            transform: scale(0.92) translateY(30px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--gold); 
            font-size: 0.9rem; 
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 13px 14px;
            background: #222;
            border: 1px solid #2f2f2f;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
        }

        .upload-wrapper {
            border: 2px dashed #333;
            padding: 28px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-wrapper:hover {
            border-color: var(--gold);
            background: rgba(197,160,89,0.03);
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .preview-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--gold);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-content { padding: 20px 18px; }
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 70px 16px 24px;
            }

            .header-flex {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: nowrap;
                gap: 12px;
            }

            h1 {
                font-size: 1.55rem;
                margin: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 58%;
            }

            .btn-gold {
                padding: 11px 20px;
                font-size: 0.92rem;
                min-width: 135px;
            }
        }

        @media (max-width: 480px) {
            .sidebar { width: 82%; }
            h1 { font-size: 1.35rem; max-width: 52%; }
            .btn-gold { padding: 10px 16px; font-size: 0.88rem; min-width: 120px; }
            .product-img { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="sidebar" id="sidebar">
        <h2>LUNABLOOM</h2>
        <a href="#" class="nav-link active"><i class="fa-solid fa-house-chimney-window"></i> Dashboard</a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-shop"></i> Saytni ko'rish</a>
        <div style="position:absolute; bottom:24px; left:20px; right:20px; text-align:center; font-size:0.78rem; color:var(--gold); opacity:0.55;">
            <i class="fa-solid fa-cloud"></i> CLOUD DATABASE CONNECTED
        </div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <div class="header-flex">
                <h1>Gullar <span style="font-weight:300; color:var(--gold);">Ombori</span></h1>
                <button class="btn-gold" onclick="toggleModal(true)">+ Guldasta qo'shish</button>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Rasm</th>
                        <th>Nomi</th>
                        <th>Kategoriya</th>
                        <th>Narxi</th>
                        <th>Amallar</th>
                    </tr>
                </thead>
                <tbody id="pTableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal (qolgan qismi o'zgarmagan) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 style="font-family: 'Cinzel'; margin-bottom: 28px; color: var(--gold);">Yangi Guldasta</h2>
            
            <div class="form-group">
                <label>Guldasta nomi</label>
                <input type="text" id="pName" placeholder="Masalan: Tungi Pari">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
                <div class="form-group">
                    <label>Kategoriya</label>
                    <select id="pCat">
                        <option value="roses">Atirgullar</option>
                        <option value="premium">Premium</option>
                        <option value="boxes">Qutilarda</option>
                        <option value="wedding">To'ylar uchun</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Narxi (so'm)</label>
                    <input type="number" id="pPrice" placeholder="500000" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Rasmlarni yuklash (maks. 5 ta)</label>
                <div class="upload-wrapper" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-images" style="font-size: 30px; color: var(--gold); margin-bottom: 8px;"></i>
                    <p style="font-size: 0.85rem; color: #888;">Rasmlarni tanlang yoki bu yerga sudrab tashlang</p>
                </div>
                <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="previewImages(this)">
                <div class="preview-grid" id="previewGrid"></div>
            </div>

            <div style="display: flex; gap: 14px; margin-top: 28px; flex-wrap: wrap;">
                <button id="saveBtn" class="btn-gold" style="flex: 2;" onclick="saveNewProduct()">Saqlash</button>
                <button class="btn-gold" style="flex: 1; background: #2a2a2a; box-shadow: none;" onclick="toggleModal(false)">Yopish</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNAYpb6L9ZTeXc555RQVWJCTDLp7cCwAI",
            authDomain: "lunabloom-1912.firebaseapp.com",
            databaseURL: "https://lunabloom-1912-default-rtdb.firebaseio.com",
            projectId: "lunabloom-1912",
            storageBucket: "lunabloom-1912.firebasestorage.app",
            messagingSenderId: "781213160103",
            appId: "1:781213160103:web:a53bbf235c8a445fc28182",
            measurementId: "G-65D3B197DC"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentImages = [];

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        function toggleModal(open) {
            const modal = document.getElementById('modalOverlay');
            if (open) {
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('active'), 10);
            } else {
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                    resetForm();
                    if (window.innerWidth <= 768) sidebar.classList.remove('active');
                }, 400);
            }
        }

        function previewImages(input) {
            const files = Array.from(input.files).slice(0, 5);
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            currentImages = [];

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    currentImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function saveNewProduct() {
            const name  = document.getElementById('pName').value.trim();
            const cat   = document.getElementById('pCat').value;
            const price = document.getElementById('pPrice').value;
            const saveBtn = document.getElementById('saveBtn');

            if (!name || !price || currentImages.length === 0) {
                alert("Nom, narx va kamida 1 ta rasm talab qilinadi!");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "Saqlanmoqda...";

            const newProduct = {
                name,
                cat,
                price: parseInt(price) || 0,
                img: currentImages[0],
                allImages: currentImages,
                timestamp: Date.now()
            };

            db.ref('flowers').push(newProduct)
                .then(() => {
                    toggleModal(false);
                    saveBtn.disabled = false;
                    saveBtn.textContent = "Saqlash";
                })
                .catch(err => {
                    alert("Xato: " + err.message);
                    saveBtn.disabled = false;
                    saveBtn.textContent = "Saqlash";
                });
        }

        function deleteP(id) {
            if (!confirm("O‘chirishni tasdiqlaysizmi?")) return;
            db.ref('flowers/' + id).remove().catch(err => alert(err.message));
        }

        function listenToProducts() {
            db.ref('flowers').on('value', snapshot => {
                const data = snapshot.val();
                const tbody = document.getElementById('pTableBody');
                tbody.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(id => {
                        const p = data[id];
                        tbody.innerHTML += `
                            <tr>
                                <td><img src="${p.img||''}" class="product-img" alt="${p.name||''}"></td>
                                <td style="font-weight:600;">${p.name||'—'}</td>
                                <td><span style="color:var(--gold); font-size:0.8rem;">${(p.cat||'').toUpperCase()}</span></td>
                                <td>${Number(p.price||0).toLocaleString('uz-UZ')} so'm</td>
                                <td><button class="action-btn" onclick="deleteP('${id}')"><i class="fa-solid fa-trash-can"></i></button></td>
                            </tr>
                        `;
                    });
                }
            });
        }

        function resetForm() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('previewGrid').innerHTML = '';
            document.getElementById('fileInput').value = '';
            currentImages = [];
        }

        window.onload = listenToProducts;
    </script>
</body>
</html>
