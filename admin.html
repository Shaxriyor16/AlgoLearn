<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LunaBloom • Royal Cloud Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #c5a059;
            --gold-dark: #9a7d46;
            --black: #0a0a0a;
            --dark-grey: #161616;
            --text-light: #e0e0e0;
            --accent-red: #ff4d4d;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--black);
            color: var(--text-light);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--dark-grey);
            border-right: 1px solid rgba(197, 160, 89, 0.1);
            padding: 40px 20px;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 50px;
        }

        .nav-link {
            display: flex;
            align-items: center; gap: 15px; color: #888; text-decoration: none;
            padding: 15px 20px; border-radius: 12px; transition: var(--transition);
            margin-bottom: 10px; font-weight: 500;
        }

        .nav-link:hover, .nav-link.active { background: rgba(197, 160, 89, 0.08); color: var(--gold); }

        .main-content { margin-left: 280px; padding: 60px; width: 100%; }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: white; border: none; padding: 14px 30px; border-radius: 12px;
            cursor: pointer; font-weight: 600; box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
            transition: var(--transition);
        }

        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(197, 160, 89, 0.3); }

        .table-card { background: var(--dark-grey); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.03); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 20px; color: var(--gold); font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #222; }
        td { padding: 20px; border-bottom: 1px solid #1f1f1f; }

        .product-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(197,160,89,0.2); }

        .action-btn {
            background: rgba(255, 77, 77, 0.1); color: var(--accent-red);
            border: none; width: 40px; height: 40px; border-radius: 10px;
            cursor: pointer; transition: 0.3s;
        }

        .action-btn:hover { background: var(--accent-red); color: white; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; transition: opacity 0.4s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-box {
            background: #1a1a1a; width: min(550px, 95%); padding: 40px;
            border-radius: 30px; border: 1px solid rgba(197, 160, 89, 0.3);
            transform: translateY(50px) scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; color: var(--gold); font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 14px; background: #222; border: 1px solid #333;
            border-radius: 12px; color: white; outline: none;
        }

        .upload-wrapper {
            border: 2px dashed #333; padding: 30px; text-align: center;
            border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .upload-wrapper:hover { border-color: var(--gold); background: rgba(197,160,89,0.02); }

        .preview-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .preview-grid img {
            width: 100%; aspect-ratio: 1; object-fit: cover;
            border-radius: 8px; border: 1px solid var(--gold);
            animation: imgIn 0.4s ease forwards;
        }

        @keyframes imgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>LUNABLOOM</h2>
        <a href="#" class="nav-link active"><i class="fa-solid fa-house-chimney-window"></i> Dashboard</a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-shop"></i> Saytni ko'rish</a>
        <div style="position:absolute; bottom:20px; width:240px; text-align:center; font-size:10px; color:var(--gold); opacity:0.6;">
            <i class="fa-solid fa-cloud"></i> CLOUD DATABASE CONNECTED
        </div>
    </nav>

    <main class="main-content">
        <div class="header-flex">
            <h1>Gullar <span style="font-weight: 300; color: var(--gold);">Ombori</span></h1>
            <button class="btn-gold" onclick="toggleModal(true)">+ Guldasta qo'shish</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Rasm</th>
                        <th>Nomi</th>
                        <th>Kategoriya</th>
                        <th>Narxi</th>
                        <th>Amallar</th>
                    </tr>
                </thead>
                <tbody id="pTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 style="font-family: 'Cinzel'; margin-bottom: 30px; color: var(--gold);">Yangi Guldasta</h2>
            
            <div class="form-group">
                <label>Guldasta nomi</label>
                <input type="text" id="pName" placeholder="Masalan: Tungi Pari">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Kategoriya</label>
                    <select id="pCat">
                        <option value="roses">Atirgullar</option>
                        <option value="premium">Premium</option>
                        <option value="boxes">Qutilarda</option>
                        <option value="wedding">To'ylar uchun</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Narxi (so'm)</label>
                    <input type="number" id="pPrice" placeholder="500000">
                </div>
            </div>

            <div class="form-group">
                <label>Rasmlarni yuklash (Maks. 5 ta)</label>
                <div class="upload-wrapper" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-images" style="font-size: 32px; color: var(--gold); margin-bottom: 10px;"></i>
                    <p style="font-size: 13px; color: #777;">Qurilmadan rasmlarni tanlang</p>
                </div>
                <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="previewImages(this)">
                <div class="preview-grid" id="previewGrid"></div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button id="saveBtn" class="btn-gold" style="flex: 2;" onclick="saveNewProduct()">Saqlash</button>
                <button class="btn-gold" style="flex: 1; background: #333; box-shadow: none;" onclick="toggleModal(false)">Yopish</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDNAYpb6L9ZTeXc555RQVWJCTDLp7cCwAI",
            authDomain: "lunabloom-1912.firebaseapp.com",
            databaseURL: "https://lunabloom-1912-default-rtdb.firebaseio.com",
            projectId: "lunabloom-1912",
            storageBucket: "lunabloom-1912.firebasestorage.app",
            messagingSenderId: "781213160103",
            appId: "1:781213160103:web:a53bbf235c8a445fc28182",
            measurementId: "G-65D3B197DC"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentImages = [];

        function toggleModal(open) {
            const modal = document.getElementById('modalOverlay');
            if(open) {
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('active'), 10);
            } else {
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                    resetForm();
                }, 400);
            }
        }

        function previewImages(input) {
            const files = Array.from(input.files).slice(0, 5);
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            currentImages = [];

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        }

        function saveNewProduct() {
            const name = document.getElementById('pName').value;
            const cat = document.getElementById('pCat').value;
            const price = document.getElementById('pPrice').value;
            const saveBtn = document.getElementById('saveBtn');

            if(!name || !price || currentImages.length === 0) {
                alert("Barcha maydonlarni to'ldiring!");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = "Saqlanmoqda...";

            const newProduct = {
                name, 
                cat, 
                price: parseInt(price), 
                img: currentImages[0], 
                allImages: currentImages,
                timestamp: Date.now()
            };

            // Firebase'ga saqlash
            db.ref('flowers').push(newProduct)
                .then(() => {
                    toggleModal(false);
                    saveBtn.disabled = false;
                    saveBtn.innerText = "Saqlash";
                })
                .catch(err => {
                    alert("Xatolik: " + err);
                    saveBtn.disabled = false;
                    saveBtn.innerText = "Saqlash";
                });
        }

        function deleteP(id) {
            if(confirm("Ushbu guldasta serverdan butunlay o'chirilsinmi?")) {
                db.ref('flowers/' + id).remove();
            }
        }

        // Ma'lumotlarni Real-Time (jonli) yuklab olish
        function listenToProducts() {
            db.ref('flowers').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('pTableBody');
                tbody.innerHTML = '';
                
                if (data) {
                    Object.keys(data).forEach(id => {
                        const p = data[id];
                        tbody.innerHTML += `
                            <tr>
                                <td><img src="${p.img}" class="product-img"></td>
                                <td style="font-weight: 600;">${p.name}</td>
                                <td><span style="color:var(--gold); font-size: 12px;">${p.cat.toUpperCase()}</span></td>
                                <td>${p.price.toLocaleString()} so'm</td>
                                <td>
                                    <button class="action-btn" onclick="deleteP('${id}')">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            });
        }

        function resetForm() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('previewGrid').innerHTML = '';
            document.getElementById('fileInput').value = '';
            currentImages = [];
        }

        window.onload = listenToProducts;
    </script>
</body>
</html>
