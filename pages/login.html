<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - AlgoLearn</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="shortcut icon" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="../index.html" class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>AlgoLearn</span>
                    </a>
                    <h1>Tizimga kirish</h1>
                    <p>Hisobingizga kiring va o'rganishni davom ettiring</p>
                </div>

                <!-- Redirect Message -->
                <div class="redirect-message" id="redirectMessage" style="display: none;">
                    <i class="fas fa-lock"></i>
                    <span>Bu sahifani ko'rish uchun tizimga kiring</span>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email manzili</label>
                        <div class="form-input-icon">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="siz@email.com"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Parol</label>
                        <div class="form-input-icon" style="position: relative;">
                            <i class="fas fa-lock"></i>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="••••••••"
                                required
                            >
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="form-checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span>Eslab qolish</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="forgotPassword()">Parolni unutdingiz?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary form-submit">
                        <i class="fas fa-sign-in-alt"></i>
                        Kirish
                    </button>
                </form>

                <div class="divider">yoki</div>

                <div class="social-login">
                    <button class="social-btn google" onclick="AuthService.loginWithGoogle()">
                        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google orqali kirish
                    </button>
                    <button class="social-btn apple" onclick="AuthService.loginWithApple()" style="margin-top: 10px;">
                        <i class="fab fa-apple"></i>
                        Apple orqali kirish
                    </button>
                </div>

                <div class="auth-footer">
                    Hisobingiz yo'qmi? 
                    <a href="register.html">Ro'yxatdan o'tish</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase SDK v10.8.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        // Check if user was redirected from protected page
        document.addEventListener('DOMContentLoaded', () => {
            const redirectUrl = sessionStorage.getItem('redirectAfterLogin');
            if (redirectUrl) {
                document.getElementById('redirectMessage').style.display = 'flex';
            }

            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!validateEmail(email)) {
                showToast('Noto\'g\'ri email manzili', 'error');
                return;
            }
            
            if (!validatePassword(password)) {
                showToast('Parol kamida 6 ta belgidan iborat bo\'lishi kerak', 'error');
                return;
            }
            
            try {
                await AuthService.login(email, password);
            } catch (error) {
                // Error handled in AuthService
            }
        });

        // Forgot password
        async function forgotPassword() {
            const email = document.getElementById('email').value;
            
            if (!email || !validateEmail(email)) {
                showToast('Iltimos, email manzilingizni kiriting', 'warning');
                document.getElementById('email').focus();
                return;
            }
            
            try {
                await AuthService.resetPassword(email);
            } catch (error) {
                // Error handled in AuthService
            }
        }
    </script>
</body>
</html>
