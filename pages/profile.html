<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - AlgoLearn</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="shortcut icon" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard { padding-top: calc(var(--header-height) + 2rem); padding-bottom: 4rem; }
        .dashboard-grid { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .sidebar { background: rgb(var(--bg-primary)); border-radius: 1rem; border: 1px solid rgb(var(--border-light)); padding: 1.5rem; height: fit-content; position: sticky; top: calc(var(--header-height) + 2rem); }
        .user-profile { text-align: center; padding-bottom: 1.5rem; border-bottom: 1px solid rgb(var(--border-light)); margin-bottom: 1.5rem; }
        .user-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 3px solid rgb(var(--primary-200)); }
        .user-name { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem; }
        .user-email { font-size: 0.875rem; color: rgb(var(--text-secondary)); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: rgb(var(--text-secondary)); font-weight: 500; transition: all var(--transition-fast); }
        .sidebar-link:hover, .sidebar-link.active { background: rgb(var(--primary-50)); color: rgb(var(--primary-600)); }
        [data-theme="dark"] .sidebar-link:hover, [data-theme="dark"] .sidebar-link.active { background: rgba(var(--primary-500), 0.1); }
        .sidebar-link i { width: 20px; text-align: center; }
        .main-content { min-height: 600px; }
        .section-card { background: rgb(var(--bg-primary)); border-radius: 1rem; border: 1px solid rgb(var(--border-light)); padding: 2rem; margin-bottom: 1.5rem; }
        .section-card h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgb(var(--border-light)); }
        .profile-header { display: flex; align-items: center; gap: 2rem; margin-bottom: 2rem; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid rgb(var(--primary-200)); }
        .profile-info h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .profile-info p { color: rgb(var(--text-secondary)); margin-bottom: 0.25rem; }
        .profile-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgb(var(--primary-100)); color: rgb(var(--primary-700)); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; margin-top: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid rgb(var(--border-light)); border-radius: 0.5rem; background: rgb(var(--bg-secondary)); color: rgb(var(--text-primary)); }
        .form-input:focus { outline: none; border-color: rgb(var(--primary-500)); }
        .form-input:disabled { opacity: 0.6; cursor: not-allowed; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .info-item { padding: 1rem; background: rgb(var(--bg-secondary)); border-radius: 0.5rem; }
        .info-item label { display: block; font-size: 0.875rem; color: rgb(var(--text-secondary)); margin-bottom: 0.25rem; }
        .info-item span { font-weight: 500; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo"><i class="fas fa-graduation-cap"></i><span>AlgoLearn</span></a>
            <div class="nav-links">
                <a href="../index.html">Bosh sahifa</a>
                <a href="../index.html#courses">Kurslar</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="btn btn-outline" onclick="AuthService.logout()"><i class="fas fa-sign-out-alt"></i> Chiqish</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <div class="dashboard-grid">
                <aside class="sidebar">
                    <div class="user-profile">
                        <img src="https://via.placeholder.com/80?text=U" alt="User" class="user-avatar" id="userAvatar">
                        <h3 class="user-name" id="userName">Foydalanuvchi</h3>
                        <p class="user-email" id="userEmail">user@example.com</p>
                    </div>
                    <nav class="sidebar-nav">
                        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
                        <a href="bookmarks.html" class="sidebar-link"><i class="fas fa-bookmark"></i> Sevimlilar</a>
                        <a href="profile.html" class="sidebar-link active"><i class="fas fa-user"></i> Profil</a>
                        <a href="#" class="sidebar-link" onclick="AuthService.logout()"><i class="fas fa-sign-out-alt"></i> Chiqish</a>
                    </nav>
                </aside>

                <main class="main-content">
                    <div class="section-card">
                        <h2><i class="fas fa-user-circle"></i> Profil ma'lumotlari</h2>
                        
                        <div class="profile-header">
                            <img src="https://via.placeholder.com/120?text=U" alt="User" class="profile-avatar" id="profileAvatar">
                            <div class="profile-info">
                                <h3 id="profileName">Foydalanuvchi</h3>
                                <p id="profileEmail">user@example.com</p>
                                <p id="providerBadge"><span class="profile-badge"><i class="fas fa-envelope"></i> Email</span></p>
                            </div>
                        </div>

                        <div class="info-grid">
                            <div class="info-item">
                                <label>Ro'yxatdan o'tgan sana</label>
                                <span id="joinedDate">-</span>
                            </div>
                            <div class="info-item">
                                <label>So'nggi faollik</label>
                                <span id="lastActive">-</span>
                            </div>
                            <div class="info-item">
                                <label>Kurslarga yozilish</label>
                                <span id="enrolledCourses">0 ta</span>
                            </div>
                            <div class="info-item">
                                <label>Sevimli kurslar</label>
                                <span id="bookmarksCount">0 ta</span>
                            </div>
                        </div>
                    </div>

                    <div class="section-card">
                        <h2><i class="fas fa-lock"></i> Xavfsizlik</h2>
                        <div class="form-group">
                            <label class="form-label">Email manzili</label>
                            <input type="email" class="form-input" id="securityEmail" disabled>
                        </div>
                        <p style="color: rgb(var(--text-secondary)); font-size: 0.875rem;">
                            <i class="fas fa-info-circle"></i> Parolni o'zgartirish va boshqa xavfsizlik sozlamalari tez orada qo'shiladi.
                        </p>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    
    <script>
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            
            // Update sidebar
            document.getElementById('userName').textContent = user.displayName || 'Foydalanuvchi';
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('profileName').textContent = user.displayName || 'Foydalanuvchi';
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('securityEmail').value = user.email;
            
            // Avatar from Google or other provider
            const avatarUrl = user.photoURL;
            if (avatarUrl) {
                document.getElementById('userAvatar').src = avatarUrl;
                document.getElementById('profileAvatar').src = avatarUrl;
            }
            
            // Provider badge
            const provider = user.providerData[0]?.providerId;
            const providerBadge = document.getElementById('providerBadge');
            if (provider === 'google.com') {
                providerBadge.innerHTML = '<span class="profile-badge"><i class="fab fa-google"></i> Google</span>';
            } else if (provider === 'apple.com') {
                providerBadge.innerHTML = '<span class="profile-badge"><i class="fab fa-apple"></i> Apple</span>';
            }
            
            // Load user stats from Firestore
            const userData = await AuthService.getUserData(user.uid);
            if (userData) {
                if (userData.createdAt) {
                    const date = userData.createdAt.toDate ? userData.createdAt.toDate() : new Date(userData.createdAt);
                    document.getElementById('joinedDate').textContent = date.toLocaleDateString('uz-UZ');
                }
                if (userData.lastActiveAt) {
                    const date = userData.lastActiveAt.toDate ? userData.lastActiveAt.toDate() : new Date(userData.lastActiveAt);
                    document.getElementById('lastActive').textContent = date.toLocaleDateString('uz-UZ');
                }
                document.getElementById('enrolledCourses').textContent = (userData.enrolledCourses?.length || 0) + ' ta';
                document.getElementById('bookmarksCount').textContent = (userData.bookmarks?.length || 0) + ' ta';
            }
        });
    </script>
</body>
</html>
